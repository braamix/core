<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>braam — two screens</title>
<style>
    html { color-scheme: dark; }
    /* No page scroll: a scrollbar appearing would narrow a canvas, which the
       resize watch would answer by reflowing the grid that made it appear. */
    html, body { overflow: hidden; }
    body {
        margin: 0;
        height: 100vh;
        height: 100dvh;
        box-sizing: border-box;
        padding: 1.25em 1.5em;
        display: grid;
        grid-template-rows: 2fr 1fr auto;
        gap: 0.75em;
        background: #111111;
        color: #aaaaaa;
        font: 13px/1.5 'Andale Mono', 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    /* min-height on both the row and the canvas: a canvas is a replaced element
       with an intrinsic 300x150 box, which would otherwise set the row's floor
       and push the page past the viewport on a short window. */
    .pane { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
    .pane canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        cursor: text;
        border: 1px solid #242632;
        touch-action: none; /* a drag over the grid selects; it does not scroll */
        -webkit-touch-callout: none; /* no magnifier on a long press */
    }
    /* The focus is on braam.js's hidden input, so canvas:focus never matches. */
    .pane canvas.braam-focus { border-color: #4a5a8a; outline: none; }
    /* The keys a touch keyboard does not have. A bar belongs to the screen it
       types into, so there are two and the focused one is shown. */
    .keys { display: none; }
    @media (any-pointer: coarse) {
        body[data-pane="upper"] #keys-upper,
        body[data-pane="lower"] #keys-lower {
            display: flex;
            flex: 0 0 auto;
            gap: 0.4rem;
            padding: 0.4rem 0 0;
        }
    }
    .braam-key {
        flex: 1 1 0;
        padding: 0.6rem 0;
        font: inherit;
        color: #aaaaaa;
        background: #1a1c26;
        border: 1px solid #242632;
        border-radius: 4px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }
    .braam-key-on { color: #111111; background: #6f7488; }
    #status {
        margin: 0;
        padding: 0.35rem 0;
        border-top: 1px solid #24263200;
        color: #6f7488;
        white-space: pre-wrap;
    }
    #status:not(:empty) { border-top-color: #242632; }
    .error { color: #ff5555; }
</style>
</head>
<body data-pane="upper">
<div class="pane"><canvas id="upper"></canvas><div class="keys" id="keys-upper"></div></div>
<div class="pane"><canvas id="lower"></canvas><div class="keys" id="keys-lower"></div></div>
<pre id="status"></pre>
<!-- With scripting off, nothing below runs. This is the only thing that speaks. -->
<noscript>
<div class="error">braam: JavaScript is off for this page, so nothing here can run.
Allow scripting for this site — an extension such as a script blocker can hold it
off even while the extension itself is disabled.</div>
</noscript>
<!-- Classic, not a module: no fetch of its own, so it runs when braam.js's never
     answers. braam.js disarms it and takes the watch over from there. One for
     the page, since one module load serves both screens. -->
<script>
const BRAAM_STALL_MS = 5000; // BOOT_STALL_MS in braam.js, which takes over
window.braamStage = "fetching braam.js";
setTimeout(() => {
    if (!window.braamStage)
        return;
    const line = document.createElement("div");
    line.className = "error";
    line.textContent = `braam: nothing happened in ${BRAAM_STALL_MS / 1000}s while `
        + `${window.braamStage}. The page loaded but its script did not.`
        + " A blocking extension or a proxy can hold a fetch open for ever;"
        + " try a private window or a profile with extensions off.";
    document.getElementById("status").appendChild(line);
}, BRAAM_STALL_MS);
</script>
<script type="module">
import { mount } from "./braam.js";

window.braamStage = null; // disarms the watchdog above

const status = document.getElementById("status");

function note(text, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = text;
    status.appendChild(line);
}

// iOS does not shrink the layout viewport for the software keyboard and
// ignores interactive-widget, so the page sizes itself from the visual
// viewport. The terminals need nothing: a shorter body is two shorter canvases,
// which braam.js already re-measures.
const vv = window.visualViewport;
if (vv) {
    const fit = () => { document.body.style.height = `${vv.height}px`; };
    vv.addEventListener("resize", fit);
    vv.addEventListener("scroll", fit);
    fit();
}

// The lower screen's ground, so the two are told apart when neither is focused.
// Only entry 0 differs: web/render.js paints the default background with it,
// and every other colour stays the one the upper screen draws in.
const lower = [
    "#0b1220", "#aa1111", "#11aa11", "#aa5511",
    "#1111aa", "#aa11aa", "#11aaaa", "#aaaaaa",
    "#555555", "#ff5555", "#55ff55", "#ffff55",
    "#5555ff", "#ff55ff", "#55ffff", "#ffffff",
];

// Two screens of one kernel: one scheduler, one filesystem, one /home — and a
// shell, a console and a ^C of its own on each (Concept.md §3.5). Two *kernels*
// on a page is the other arrangement, and web/embed.html is that one.
try {
    const term = mount({
        screens: [
            { canvas: document.getElementById("upper"), keys: document.getElementById("keys-upper") },
            {
                canvas: document.getElementById("lower"),
                keys: document.getElementById("keys-lower"),
                palette: lower,
            },
        ],
        onLog: (text) => console.log(text),
        onError: (text) => {
            console.error(text);
            note(text, "error");
        },
    });

    // Click a screen to type in it; braam.js moves the focus and the ring with
    // it. This only keeps the page's own flag in step, which is what shows the
    // right key bar on a touch screen.
    const names = ["upper", "lower"];
    for (let i = 0; i < term.screens.length; i++)
        term.screens[i].canvas.addEventListener("pointerdown", () => {
            document.body.dataset.pane = names[i];
        });

    term.focus(0);
} catch (e) {
    note(e.message, "error");
}
</script>
</body>
</html>
